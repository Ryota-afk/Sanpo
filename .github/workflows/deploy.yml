name: Deploy to GitHub Pages

# このブランチに変更が入るたびに、自動でビルドして GitHub Pages に公開する。
on:
  push:
    branches:
      - claude/walking-route-app-spec-s7icb4
  workflow_dispatch: {}

# GitHub Pages への公開に必要な権限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに絞る(古い公開が新しい公開を上書きしないように)。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GitHub Pages はリポジトリ名のサブパスで配信されるため、ベースパスを合わせる。
        run: npm run build
        env:
          BASE_PATH: /Sanpo/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
